plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.kinectrig.capture'
    compileSdk 35

    defaultConfig {
        applicationId 'dev.kinectrig.capture'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '0.1'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.ar:core:1.48.0'
}
